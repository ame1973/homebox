        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: Origin
        in: header
        required: true
        description: Exact configured browser origin, including scheme and nondefault port. Null, absent, cross-origin, and duplicate values are rejected.
        schema:
          type: string
          minLength: 1
          maxLength: 2048
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 256
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      - name: X-HomeBox-Client-Version
        in: header
        required: true
