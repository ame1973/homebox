          type: string
          minLength: 1
          maxLength: 32
        description: Semantic application version. Incompatible writes return 426.
      x-max-body-bytes: 16384
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPasswordChange'
  /auth/reauth:
    post:
      operationId: post_auth_reauth
