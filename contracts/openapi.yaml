openapi: 3.1.0
info:
  title: HomeBox API
  version: 0.1.0
  description: Executable HTTP contract for the first HomeBox application release.
    Private same-origin API; the contract does not imply runtime implementation. Amounts
    and stock counts are safe integers. All protected responses use no-store.
  license:
    name: MIT
    identifier: MIT
servers:
- url: /api/v1
security:
- SessionCookie: []
paths:
  /auth/login:
    post:
      operationId: post_auth_login
      summary: Login
      description: Validate credentials and issue a fresh opaque HttpOnly, host-only, SameSite=Strict session cookie. Secure is mandatory on HTTPS; plaintext is limited to actual direct loopback development. Origin is required; this anonymous operation does not use a session CSRF token.
      tags:
      - auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
          headers:
            Set-Cookie:
              description: Host-only session cookie; HttpOnly, SameSite=Strict, Path=/, and Secure on HTTPS. Logout/password success expires it. No raw session credential is returned in JSON.
              schema:
                type: string
            Cache-Control:
              schema:
                const: no-store
              description: Protected API data is never cached by the service worker.
            ETag:
              schema:
                type: string
                minLength: 3
                maxLength: 64
              description: Quoted resource revision when a versioned resource is returned.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '409':
          $ref: '#/components/responses/Error409'
        '426':
          $ref: '#/components/responses/Error426'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      x-max-body-bytes: 16384
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      security: []
      parameters:
      - name: Origin
        in: header
        required: true
        description: Exact configured browser origin, including scheme and nondefault port. Null, absent, cross-origin, and duplicate values are rejected.
        schema:
          type: string
          minLength: 1
          maxLength: 2048
  /auth/logout:
    post:
      operationId: post_auth_logout
      summary: Logout
      description: Revoke the current session and clear its cookie. Requires Origin, CSRF, client version, and idempotency. No body is accepted. An exact retry with the original cookie and CSRF token returns only the frozen acknowledgement, never renewed authorization.
      tags:
      - auth
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAck'
          headers:
            Set-Cookie:
              description: Host-only session cookie; HttpOnly, SameSite=Strict, Path=/, and Secure on HTTPS. Logout/password success expires it. No raw session credential is returned in JSON.
              schema:
