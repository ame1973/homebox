            type: string
            minLength: 1
          entity_revision:
            type: integer
            minimum: 1
          operation:
            const: upsert
          projection_version:
            const: 1
          payload:
            $ref: '#/components/schemas/OfflineRecord/$defs/stock'
      - type: object
        additionalProperties: false
        required:
        - entity_type
        - entity_id
        - entity_revision
        - operation
        - projection_version
        - payload
        properties:
          entity_type:
            const: barcode
          entity_id:
            type: string
            minLength: 1
          entity_revision:
            type: integer
            minimum: 1
          operation:
            const: upsert
          projection_version:
            const: 1
          payload:
            $ref: '#/components/schemas/OfflineRecord/$defs/barcode'
      - type: object
        additionalProperties: false
