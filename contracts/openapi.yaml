            Cache-Control:
              schema:
                const: no-store
              description: Protected API data is never cached by the service worker.
            ETag:
              schema:
                type: string
                minLength: 3
                maxLength: 64
              description: Quoted resource revision when a versioned resource is returned.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '409':
          $ref: '#/components/responses/Error409'
        '426':
          $ref: '#/components/responses/Error426'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: Origin
        in: header
        required: true
        description: Exact configured browser origin, including scheme and nondefault port. Null, absent, cross-origin, and duplicate values are rejected.
        schema:
          type: string
          minLength: 1
          maxLength: 2048
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 256
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      - name: X-HomeBox-Client-Version
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 32
        description: Semantic application version. Incompatible writes return 426.
