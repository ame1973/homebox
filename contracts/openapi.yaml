components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: homebox_session
    WorkerToken:
      type: http
      scheme: bearer
      description: Separate scoped worker credential; never an admin session.
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 100
            message:
              type: string
              minLength: 1
              maxLength: 10000
            request_id: &id001
              type: string
              minLength: 1
              maxLength: 128
            details:
              type: object
              additionalProperties: true
          required:
          - code
          - message
          - request_id
          - details
      required:
      - error
    Version:
      type: object
      additionalProperties: false
      properties:
        api_version:
          type: string
          minLength: 1
          maxLength: 32
        projection_version:
          const: 1
        offline_projection_version:
          const: 1
        dataset_epoch: *id001
        server_instance_id: *id001
        web_build_id: *id001
        web_version:
          type: string
          minLength: 1
          maxLength: 32
        schema_version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        min_supported_client:
          type: string
          minLength: 1
          maxLength: 32
        min_web_build_id: *id001
        model_index_versions:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 256
          maxItems: 500
      required:
      - api_version
      - projection_version
      - offline_projection_version
      - dataset_epoch
      - server_instance_id
      - web_build_id
      - web_version
      - schema_version
      - min_supported_client
      - min_web_build_id
      - model_index_versions
    Change:
      type: object
      required:
      - seq
      - record
      properties:
        seq:
          type: integer
          minimum: 1
        record:
          $ref: '#/components/schemas/OfflineRecord'
    OfflineRecord:
      title: HomeBox offline projection record v0.9
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - entity_type
        - entity_id
        - entity_revision
        - operation
        - projection_version
        - payload
        properties:
          entity_type:
            const: location
          entity_id:
            type: string
            minLength: 1
          entity_revision:
            type: integer
            minimum: 1
          operation:
            const: upsert
          projection_version:
            const: 1
          payload:
            $ref: '#/components/schemas/OfflineRecord/$defs/location'
      - type: object
        additionalProperties: false
        required:
        - entity_type
        - entity_id
        - entity_revision
        - operation
        - projection_version
        - payload
        properties:
          entity_type:
            const: item
          entity_id:
            type: string
            minLength: 1
          entity_revision:
            type: integer
            minimum: 1
          operation:
            const: upsert
          projection_version:
            const: 1
          payload:
            $ref: '#/components/schemas/OfflineRecord/$defs/item'
      - type: object
        additionalProperties: false
        required:
        - entity_type
        - entity_id
        - entity_revision
        - operation
        - projection_version
        - payload
        properties:
          entity_type:
            const: unit
          entity_id:
            type: string
            minLength: 1
          entity_revision:
            type: integer
            minimum: 1
          operation:
            const: upsert
          projection_version:
            const: 1
          payload:
            $ref: '#/components/schemas/OfflineRecord/$defs/unit'
      - type: object
        additionalProperties: false
        required:
        - entity_type
        - entity_id
        - entity_revision
        - operation
        - projection_version
        - payload
        properties:
          entity_type:
            const: stock
