          minLength: 0
          maxLength: 10000
          default: ''
        tracking_mode:
          enum:
          - individual
          - quantity
          default: individual
        category_id: *catalogNullableID
        unit_code:
          type: string
          minLength: 1
          maxLength: 32
          default: pcs
        base_unit:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[A-Za-z][A-Za-z0-9_/-]{0,31}(?![\s\S])
          default: pcs
        scale_factor:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          default: 1
        status:
          enum:
          - active
          - archived
          default: active
      required:
      - name
      allOf:
      - if:
          anyOf:
          - required:
            - unit_code
            properties:
              unit_code:
                not:
                  const: pcs
          - required:
            - base_unit
            properties:
              base_unit:
                not:
                  const: pcs
          - required:
            - scale_factor
            properties:
              scale_factor:
                not:
                  const: 1
        then:
